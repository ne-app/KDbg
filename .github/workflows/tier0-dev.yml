name: Ne.app Tier0 Kits Linux (Nectar, Develop)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Attempt NeBuild
      run: sudo curl https://github.com/ne-app/ne-build/releases/download/v0.0.6-apple-m1/nebuild-debian -o sanity-test
    - name: Build Tier0Kit and DebuggerKit
      run: sudo curl https://github.com/ne-app/ne-build/releases/download/v0.0.6-apple-m1/nebuild-debian -o /bin/nebuild && sudo chmod +x /bin/nebuild && sudo apt update && sudo apt install build-essential && sudo apt install libboost-dev &&
          cd private/src/DebuggerKit && nebuild dk-posix.json

